plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def propsFile = new File(
        System.getenv('SPACELENS_KEYSTORE_PROPERTIES')
                ?: "${System.getProperty('user.home')}/.workbuddy/secrets/spacelens/keystore.properties")
def keyProps = new Properties()
def hasKey = propsFile.isFile()
if (hasKey) {
    propsFile.withInputStream { keyProps.load(it) }
}

android {
    namespace 'com.spacelens.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hu4222.filelens"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "1.3.0"
    }

    signingConfigs {
        release {
            if (hasKey) {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKey) {
                signingConfig signingConfigs.release
            }
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xjvm-default=all']
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['DebugProbesKt.bin', 'META-INF/versions/9/OSGiManifest.mf',
                         'META-INF/*.kotlin_module', 'kotlin/**', 'META-INF/*.version']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "dev.rikka.shizuku:aidl:13.1.5"
    implementation "com.google.zxing:core:3.5.3"
}
